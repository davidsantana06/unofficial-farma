name: unofficial-farma-services

services:
  db:
    image: postgres:16
    container_name: unofficial-farma-db
    hostname: unofficial-farma-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unofficial-farma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  company:
    build: .
    container_name: unofficial-farma-company-service
    hostname: unofficial-farma-company-service
    command: python /app/__main__.py
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@unofficial-farma-db:5432/app
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8001:8001"
    volumes:
      - ./company:/app
    networks:
      - unofficial-farma-network
    depends_on:
      db:
        condition: service_healthy

  product:
    build: .
    container_name: unofficial-farma-product-service
    hostname: unofficial-farma-product-service
    command: python /app/__main__.py
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@unofficial-farma-db:5432/app
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8002:8002"
    volumes:
      - ./product:/app
    networks:
      - unofficial-farma-network
    depends_on:
      db:
        condition: service_healthy
      company:
        condition: service_started

  comment:
    build: .
    container_name: unofficial-farma-comment-service
    hostname: unofficial-farma-comment-service
    command: python /app/__main__.py
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@unofficial-farma-db:5432/app
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8003:8003"
    volumes:
      - ./comment:/app
    networks:
      - unofficial-farma-network
    depends_on:
      db:
        condition: service_healthy

networks:
  unofficial-farma-network:
    name: unofficial-farma-network
    driver: bridge

volumes:
  pgdata:
